[package]
name = "sandcastle-nitro-key"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Nitro spike's key helper in the guest (docs/nitro-spike.md, acceptance 8): a sealed disk's key from KMS over TLS the guest ends itself, Amazon's roots pinned, the parent a byte pipe that signs but cannot read or choose."

[[bin]]
name = "nitro-key"
path = "src/main.rs"

# rustls and ring are the workspace's own (the egress proxy's). ring has C,
# so this builds for the image's glibc, not static musl like the probe.
[dependencies]
sandcastle-nitro-attest.workspace = true
sandcastle-nitro-probe.workspace = true
base64.workspace = true
hex.workspace = true
libc.workspace = true
rsa.workspace = true
# The disk header's and counter's HMACs, and the S3 signature (disk.rs, s3.rs).
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
webpki-roots.workspace = true
