[package]
name = "sandcastle-nitro-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Nitro spike's driver (docs/nitro-spike.md): Firecracker's configuration for a Nitro Sandbox, the parent's pool accounting, and the verification of a sandbox's attestation document on the operator's machine. A lower-rung diagnostic, not the product."

[[bin]]
name = "sandcastle-nitro-spike"
path = "src/main.rs"

[dependencies]
sandcastle-nitro-attest.workspace = true
sandcastle-nitro-probe.workspace = true
sandcastle-wire.workspace = true
sandcastle-vm.workspace = true
sandcastle-egress.workspace = true
base64.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
memchr.workspace = true
ring.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
