[package]
name = "sandcastle-nitro-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Nitro spike's guest probe (docs/nitro-spike.md, acceptance 2 to 5): a static init for an initrd that says hello over vsock, holds canaries, asks its NSM for attestation documents, and opens what KMS releases to it. Its protocol with the driver, the NSM's CBOR and KMS's CMS envelope are pure and tested on any host."

[[bin]]
name = "nitro-probe"
path = "src/main.rs"

# Pure Rust only, so the probe links statically for musl with no C
# toolchain for the target: no ring here (the verifier, which has it, runs
# on the operator's side). RSA because KMS encrypts to the document's RSA
# key (RSAES_OAEP_SHA_256, its only recipient algorithm); AES-256-CBC
# because that is CMS's content cipher in what KMS returns.
[dependencies]
aes.workspace = true
cbc.workspace = true
hex.workspace = true
libc.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
