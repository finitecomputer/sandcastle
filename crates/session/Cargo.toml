[package]
name = "sandcastle-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The attested session from a home to a Nitro Sandbox's guest (docs/nitro.md): Noise NK to the key the guest's NSM document binds, claimed once per life, then NKpsk0 resumes keyed by that session's secret; every byte the parent carries is ciphertext."

# snow with its default resolver is pure Rust (ChaCha20-Poly1305,
# Curve25519, SHA-256), so the guest's static musl build needs no C
# toolchain; ring, the workspace's other crypto, does.
[dependencies]
snow.workspace = true
serde.workspace = true
thiserror.workspace = true
hex.workspace = true
